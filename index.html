  function normalize(str) {
    return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function searchCert() {
    const rawInput = document.getElementById('userInput').value.trim();
    if (!rawInput) {
      alert("Please enter Name, Roll No, or Email.");
      return;
    }

    const normInput = normalize(rawInput);
    const digitsOnly = rawInput.replace(/\D/g, '');

    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const canvas = document.getElementById('canvas');
    const dl = document.getElementById('dl');

    const match = dataset.find(user => {
      const normName = normalize(user.name);
      const normRoll = normalize(user.roll);
      const normEmail = normalize(user.email);
      const rollDigits = (user.roll || '').replace(/\D/g, '');

      const nameMatch = normName && (normName.includes(normInput) || normInput.includes(normName));
      const exactRollMatch = normRoll && (normRoll === normInput || normRoll.includes(normInput) || normInput.includes(normRoll));
      const exactEmailMatch = normEmail && normEmail.includes(normInput);
      const digitMatch = digitsOnly.length >= 4 && rollDigits.includes(digitsOnly);

      return nameMatch || exactRollMatch || exactEmailMatch || digitMatch;
    });

    result.style.display = "block";

    if (match) {
      const displayName = match.name || match.roll;
      status.className = "msg success";
      status.innerText = "Verified! Certificate ready for: " + displayName;
      drawCert(displayName);
    } else {
      status.className = "msg error";
      status.innerText = "No match found! Check your spelling or Roll No.";
      canvas.style.display = "none";
      dl.style.display = "none";
    }
  }

  function drawCert(nameText) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const dl = document.getElementById('dl');

    const img = new Image();
    img.src = 'Take a look at my Canva design!.jpg';

    img.onload = function() {
      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      ctx.fillStyle = "#1a365d";
      ctx.font = "bold " + Math.round(canvas.height * 0.045) + "px sans-serif";
      ctx.textAlign = "center";
      
      // ADJUSTED HERE: Changed 0.52 to 0.465 to shift the name up above the line
      ctx.fillText(nameText, canvas.width / 2, canvas.height * 0.465);

      canvas.style.display = "block";
      dl.href = canvas.toDataURL("image/png");
      dl.style.display = "block";
    };

    img.onerror = function() {
      canvas.width = 1000;
      canvas.height = 700;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 1000, 700);
      ctx.strokeStyle = "#1a365d";
      ctx.lineWidth = 10;
      ctx.strokeRect(20, 20, 960, 660);

      ctx.fillStyle = "#1a365d";
      ctx.font = "bold 40px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("CERTIFICATE OF PARTICIPATION", 500, 150);
      ctx.fillText(nameText, 500, 350);

      canvas.style.display = "block";
      dl.href = canvas.toDataURL("image/png");
      dl.style.display = "block";
    };
  }
